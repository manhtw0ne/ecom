services:
  mysql8-container:
    container_name: mysql8-container
    image: mysql:8.2.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Abc123456789@
      MYSQL_DATABASE: ecom_db
    ports:
      - "3307:3306"
    networks:
      - ecom-network

  phpmyadmin8-container:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin8-container
    restart: always
    depends_on:
      - mysql8-container
    ports:
      - "8100:80"
    environment:
      PMA_HOST: mysql8-container
      PMA_PORT: 3306
      UPLOAD_LIMIT: 500M
    networks:
      - ecom-network

  redis-container:
    image: redis:7.2.3
    container_name: redis-container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - ecom-network

  ecom-spring-container:
    container_name: ecom-spring-container
    build:
      context:
      dockerfile: DockerfileJavaSpring
    ports:
      - "8099:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql8-container:3306/ecom_db?serverTimezone=UTC&allowPublicKeyRetrieval=true
      MYSQL_ROOT_PASSWORD: Abv123456789@
      REDIS_HOST: redis-container
      REDIS_PORT: 6379
      KAFKA_BROKER_SERVER: kafka-broker-01
      KAFKA_BROKER_PORT: 19092
    depends_on:
      - mysql8-container
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8088/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  ecom-network:
    name: ecom-network
    driver: bridge



