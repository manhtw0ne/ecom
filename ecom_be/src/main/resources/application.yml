spring:
  application:
    name: ecom

  # Database
  datasource:
    url: jdbc:mysql://localhost:3306/ecom_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none       # Flyway quản lý schema — không để Hibernate tự tạo
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Flyway
  flyway:
    enabled: false          # Tắt auto-config, FlywayConfig.java tự quản lý
    locations: classpath:db/migration

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      use-redis-cache: true

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.type.mapping]": "category:com.manh.ecom_be.models.Category"
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      group-id: ecom_db-group
      auto-offset-reset: earliest

  # OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:4300/auth/google/callback}"
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            resource-server:
              opaque-token:
                introspection-uri: https://www.googleapis.com/oauth2/v3
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:your-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
            redirect-uri: "${FACEBOOK_REDIRECT_URI:http://localhost:4300/auth/facebook/callback}"
            token-uri: https://graph.facebook.com/v13.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture

  # File upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # i18n
  messages:
    basename: i18n/messages
    encoding: UTF-8
    default-locale: en

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

# JWT — phải ở root level
jwt:
  expiration: 2592000              # 30 ngày (giây)
  expiration-refresh-token: 31536000  # 365 ngày (giây)
  secretKey: TaqlmGv1iEDMRiFp/pHuID1+T84IABfuA0xXh4GhiUI=

# API prefix — phải ở root level
api:
  prefix: /api/v1

# Logging
logging:
  level:
    org:
      springframework.security: DEBUG

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  show-actuator: true

# Actuator / Health check — phải ở root level
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: "health, info"

